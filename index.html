<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Kazi Midul Hossen — Sr. Data Engineer</title>
    <meta
      name="description"
      content="Sr. Data Engineer with 5+ years building ETL/ELT pipelines, data warehouses and backend systems across GCP, AWS and Azure. Airflow, dbt, BigQuery, Spring Boot, Terraform."
    />
    <meta name="author" content="Kazi Midul Hossen" />
    <meta name="theme-color" content="#070B12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F9FC" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kazi Midul Hossen — Sr. Data Engineer" />
    <meta
      property="og:description"
      content="5+ years building ETL/ELT pipelines and backend systems across GCP, AWS and Azure."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Resolve the theme before first paint so there is no light flash on a dark-default site.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored ? stored === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* private mode / storage blocked — keep the dark default from the html class */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
